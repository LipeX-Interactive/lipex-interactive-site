<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Recuperar senha — LipeX Interactive Games</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body class="password-recovery-page" data-title-pt="Recuperar senha — LipeX Interactive Games">
<main class="password-recovery-shell">
<div class="password-recovery-top">
<a class="password-recovery-brand" href="index.html"><img src="assets/lipex-emblem.png" alt="LipeX"/><div><strong>LipeX</strong><small>INTERACTIVE GAMES</small></div></a>
<div class="recovery-language"><button class="active" data-recovery-language="pt" type="button">PT</button><button data-recovery-language="en" type="button">EN</button></div>
</div>
<section class="password-recovery-card">
<div class="auth-brand"><img alt="LipeX" src="assets/lipex-emblem.png"/><span data-i18n="CRIAR NOVA SENHA">CRIAR NOVA SENHA</span></div>
<h1 data-i18n="Crie uma nova senha">Crie uma nova senha</h1>
<p data-i18n="Use uma senha nova para voltar a acessar sua conta LipeX.">Use uma senha nova para voltar a acessar sua conta LipeX.</p>
<p class="recovery-status" data-type="info" id="recovery-status" data-i18n="Validando link de recuperação...">Validando link de recuperação...</p>
<form id="recovery-form" hidden>
<label data-i18n="Nova senha" for="recovery-password">Nova senha</label>
<input id="recovery-password" type="password" minlength="6" autocomplete="new-password" data-i18n-placeholder="Digite a nova senha" placeholder="Digite a nova senha" required/>
<label data-i18n="Confirmar nova senha" for="recovery-password-confirm">Confirmar nova senha</label>
<input id="recovery-password-confirm" type="password" minlength="6" autocomplete="new-password" data-i18n-placeholder="Repita a nova senha" placeholder="Repita a nova senha" required/>
<button class="btn btn-primary auth-submit" id="recovery-submit" type="submit" data-i18n="Salvar nova senha">Salvar nova senha</button>
</form>
<a class="recovery-back" href="index.html" data-i18n="Voltar ao site">Voltar ao site</a>
</section>
</main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="i18n.js"></script><script src="site-editor.js"></script>
<script src="reset-password.js"></script>
</body>
</html>
